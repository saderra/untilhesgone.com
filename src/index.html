<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Donald Trump Second Term</title>
    <meta name="description" content="A Countdown Timer of Donald Trump's Second Term">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Style Sheet -->
    <link rel="stylesheet" href="/assets/css/main.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">

    <!-- Fathom - beautiful, simple website analytics -->
    <script src="https://cdn.usefathom.com/script.js" data-site="IKVHMXXP" defer></script>
    <!-- / Fathom -->

    <link rel="stylesheet" href="/ext/flipdown/flipdown.min.css"/>
    <style type="text/css">
        .flipdown {
            width: auto;
        }
        .gas-ticker-dollar {
            display: inline-flex;
            align-items: center;
            height: 80px;
            font-family: sans-serif;
            font-weight: bold;
            font-size: 3rem;
            color: #fff;
        }
        @media (max-width: 550px) {
            .gas-ticker-dollar {
                height: 50px;
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body class="bg-neutral-200">
    <div class="p-8">
        <h1 class="text-3xl md:text-4xl pb-8 mb-8 font-medium text-neutral-700 brand-font uppercase">The Second Term<br />of Donald Trump<br />Countdown</h1>

        <div id="flipdown-container">
            <div id="flipdown" class="flipdown"></div>
        </div>

        <script src="/ext/flipdown/flipdown.min.js"></script>
        <script>
            const endDate = new Date("Jan 20, 2029 12:00:00")
            const endTimestamp = endDate.getTime() / 1000

            const fd = new FlipDown(endTimestamp).start()
        </script>

        <script src="/ext/flip-ticker/flip-ticker.js"></script>

        <div class="pt-16">
            <h2 class="text-xl md:text-2xl mb-4 font-medium text-neutral-700 brand-font uppercase">Meanwhile, Gas Costs</h2>

            <div class="flex items-end">
                <span class="gas-ticker-dollar">$</span>
                <div id="gas-ticker"></div>
            </div>

            <p id="gas-ticker-status" class="text-sm text-neutral-500 pt-2 brand-font tracking-wide"></p>
        </div>

        <script src="/ext/gas-ticker/gas-ticker.js"></script>
        <script>
            window.initGasTicker('gas-ticker', 'gas-ticker-status', 'Gas Price')
        </script>

        <div class="pt-16">
            <h2 class="text-xl md:text-2xl mb-4 font-medium text-neutral-700 brand-font uppercase">Meanwhile In Iran</h2>

            <div id="iran-ticker"></div>

            <p id="iran-ticker-status" class="text-sm text-neutral-500 pt-2 brand-font tracking-wide">Days since February 28, 2026</p>
        </div>

        <script src="/ext/flip-ticker/days-since.js"></script>
        <script>
            const iranStartDate = new Date("Feb 28, 2026 00:00:00")
            window.initDaysSinceTicker('iran-ticker', 'iran-ticker-status', iranStartDate, 'Days')
        </script>

        <p class="py-12"><a href="https://corinnefreer.com/" class="brand-font underline tracking-wide">Visit CorinneFreer.com &raquo;</a></p>
    </div>
</body>
</html>
